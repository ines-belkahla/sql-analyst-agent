services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: sql-analyst-dev:python3.11
    container_name: sql-analyst-dev
    working_dir: /workspace
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - .:/workspace
      - huggingface_cache:/root/.cache/huggingface
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HOME: /root/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"

volumes:
  huggingface_cache:
