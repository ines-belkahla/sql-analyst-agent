# Reproducible pipeline.  Everything:  dvc repro     One stage:  dvc repro clean
stages:
  build_eval_set:                       # Person A
    cmd: python -m evaluation.datasets.build_eval_set
    deps: [data/raw, evaluation/datasets/build_eval_set.py, data_engineering/config.py]
    params: [eval]
    outs:
      - evaluation/data/eval_set.jsonl:
          cache: false                  # small, stays visible in Git

  clean:                                # Person A  (STEP 1: data cleaning)
    cmd: python -m data_engineering.processing.clean
    deps: [data/raw, data/glossary, data_engineering/processing/clean.py, data_engineering/config.py]
    params: [clean]
    outs: [data/processed]              # schema.json, documents.jsonl, cleaning_report.json

  index:                                # Person A  (STEP 2: retrieval index)
    cmd: python -m data_engineering.retrieval.index
    deps: [data/processed, data_engineering/retrieval/index.py, data_engineering/retrieval/embeddings.py, data_engineering/config.py]
    params: [embedding]
    outs: [data/index]

  eval_retrieval:                       # Person A
    cmd: python -m evaluation.retrieval.eval_retrieval
    deps: [data/index, data/processed, evaluation/data/eval_set.jsonl, evaluation/retrieval, data_engineering/retrieval]
    params: [retrieval]
    metrics:
      - evaluation/results/retrieval_metrics.json:
          cache: false

  # eval_generation:                    # Person B adds: EX with/without evidence, repair, safety, refusals
  #   cmd: python -m evaluation.generation.eval_generation
  #   deps: [data/index, evaluation/data/eval_set.jsonl, agent]
  #   metrics: [evaluation/results/generation_metrics.json: {cache: false}]
