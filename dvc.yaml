# DVC pipeline for the data part.  Run everything: dvc repro   One step: dvc repro clean
# data/raw (our 3 databases) is tracked separately with "dvc add data/raw".
# Indexing into Qdrant is not a DVC step: Qdrant stores its data in Docker,
# so each person runs "python -m data_engineering.retrieval.index" (a few seconds).
stages:
  clean:
    cmd: python -m data_engineering.processing.clean
    deps:
      - data/raw
      - data_engineering/processing/clean.py
      - data_engineering/config.py
    outs:
      - data/processed

  build_eval_set:
    cmd: python -m evaluation.datasets.build_eval_set
    deps:
      - data/raw
      - evaluation/datasets/build_eval_set.py
      - data_engineering/config.py
    outs:
      - data/questions/eval.jsonl:
          cache: false        # small: kept visible in Git
      - data/questions/dev.jsonl:
          cache: false

  eval_retrieval:             # needs Qdrant running and indexed
    cmd: python -m evaluation.retrieval.eval_retrieval
    deps:
      - data/processed
      - data/questions/eval.jsonl
      - data_engineering/data_api.py
      - evaluation/retrieval/eval_retrieval.py
    metrics:
      - evaluation/results/retrieval_metrics.json:
          cache: false
