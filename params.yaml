clean:
  sample_values: 5               # distinct example values stored per column
  sample_value_max_chars: 40
  value_description_max_chars: 600
embedding:
  model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
retrieval:
  k: 20                          # documents fetched per question
  max_tables: 6                  # tables given to the SQL generator
  fk_expand: 2                   # extra tables added through foreign keys
  max_cols_per_table: 25
eval:
  seed: 42
  n_questions: 60
