# Qdrant vector database, exactly as in the course (labs/04-rag).
#   Start: docker compose up -d      Stop: docker compose down
#   Dashboard: http://localhost:6333/dashboard
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sql_analyst_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
